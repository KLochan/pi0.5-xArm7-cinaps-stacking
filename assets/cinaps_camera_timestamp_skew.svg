<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 500" role="img" aria-labelledby="title desc">
<title id="title">CINAPS two-camera callback timestamp differences</title>
<desc id="desc">Among 11,520 pairs, 29.44% exceed 50ms, 13.52% exceed 100ms, 3.31% exceed 200ms, 0.53% exceed 500ms and 0.10% exceed 1000ms. Median difference 26.23 ms; p95 144.7 ms. These are callback times, not sensor capture timestamps.</desc>
<style>
.title{font:700 25px Arial,sans-serif;fill:#14283f}.sub{font:16px Arial,sans-serif;fill:#536476}.tick{font:14px Arial,sans-serif;fill:#526579}.value{font:700 17px Arial,sans-serif;fill:#1c3652}.axis{font:15px Arial,sans-serif;fill:#293c52}.count{font:13px Arial,sans-serif;fill:#657487}.foot{font:13px Arial,sans-serif;fill:#56677a}
</style>
<rect width="1010" height="500" rx="12" fill="#ffffff"/>
<text x="50" y="48" class="title">CINAPS camera timestamp differences</text>
<text x="50" y="76" class="sub">Share of 11,520 frame pairs above each callback-time threshold</text>
<line x1="96" y1="365.0" x2="925" y2="365.0" stroke="#dbe3ed" stroke-width="1"/><text x="78" y="370.0" text-anchor="end" class="tick">0%</text><line x1="96" y1="297.9" x2="925" y2="297.9" stroke="#dbe3ed" stroke-width="1"/><text x="78" y="302.9" text-anchor="end" class="tick">10%</text><line x1="96" y1="230.7" x2="925" y2="230.7" stroke="#dbe3ed" stroke-width="1"/><text x="78" y="235.7" text-anchor="end" class="tick">20%</text><line x1="96" y1="163.6" x2="925" y2="163.6" stroke="#dbe3ed" stroke-width="1"/><text x="78" y="168.6" text-anchor="end" class="tick">30%</text>
<rect x="155" y="167.33" width="92" height="197.67" rx="4" fill="#3b78b5"/><text x="201" y="155.3" text-anchor="middle" class="value">29.44%</text><text x="201" y="395" text-anchor="middle" class="axis">&gt; 50 ms</text><text x="201" y="418" text-anchor="middle" class="count">n = 3,391</text><rect x="319" y="274.22" width="92" height="90.78" rx="4" fill="#3b78b5"/><text x="365" y="262.2" text-anchor="middle" class="value">13.52%</text><text x="365" y="395" text-anchor="middle" class="axis">&gt; 100 ms</text><text x="365" y="418" text-anchor="middle" class="count">n = 1,557</text><rect x="483" y="342.78" width="92" height="22.22" rx="4" fill="#3b78b5"/><text x="529" y="330.8" text-anchor="middle" class="value">3.31%</text><text x="529" y="395" text-anchor="middle" class="axis">&gt; 200 ms</text><text x="529" y="418" text-anchor="middle" class="count">n = 381</text><rect x="647" y="361.44" width="92" height="3.56" rx="4" fill="#3b78b5"/><text x="693" y="349.4" text-anchor="middle" class="value">0.53%</text><text x="693" y="395" text-anchor="middle" class="axis">&gt; 500 ms</text><text x="693" y="418" text-anchor="middle" class="count">n = 61</text><rect x="811" y="364.33" width="92" height="0.67" rx="4" fill="#3b78b5"/><text x="857" y="352.3" text-anchor="middle" class="value">0.10%</text><text x="857" y="395" text-anchor="middle" class="axis">&gt; 1000 ms</text><text x="857" y="418" text-anchor="middle" class="count">n = 11</text>
<text x="50" y="455" class="foot">Median: 26.23 ms  |  95th percentile: 144.7 ms  |  Maximum: 1,614.69 ms</text>
<text x="50" y="477" class="foot">Callback timestamps are not hardware capture timestamps; synchronization remains under review.</text>
